<!DOCTYPE html>
<html>
<head>
  <base href="/eromu_app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Erőmű szakaszolás segédlet.">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Erőmű">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link id="dynamic-favicon" rel="icon" type="image/png" href="eromu_favicon.png?v=3"/>

  <title>Erőmű - Szakaszolás segédlet</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter.js" defer></script>
  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: "$FLUTTER_SERVICE_WORKER_VERSION",
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp().then(function() {
              // Kényszerítsük a saját ikonunkat az app betöltődése után is!
              var link = document.getElementById('dynamic-favicon');
              if (link) {
                link.href = 'eromu_favicon.png?v=3';
              }
            });
          });
        }
      });
    });
  </script>
</body>
</html>
